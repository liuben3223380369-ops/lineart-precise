name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: pip install pyinstaller opencv-python-headless numpy
      - name: Build single-file EXE
        run: pyinstaller lineart.spec --noconfirm
      - name: Smoke test (CLI)
        shell: pwsh
        run: |
          dist/lineart.exe demo/samples/pixel_art.png -o smoke_out.png
          if (-not (Test-Path smoke_out.png)) { throw "smoke test failed: no output" }
      - name: Functional selfcheck (artifact gate)
        shell: pwsh
        run: |
          dist/lineart.exe --selfcheck
          if ($LASTEXITCODE -ne 0) { throw "selfcheck failed: core functionality broken in packaged EXE" }
      - uses: actions/upload-artifact@v4
        with:
          name: lineart-windows
          path: dist/lineart.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: pip install pyinstaller opencv-python-headless numpy
      - name: Build single-file binary
        run: pyinstaller lineart.spec --noconfirm
      - name: Smoke test (CLI)
        run: |
          dist/lineart demo/samples/pixel_art.png -o smoke_out.png
          test -s smoke_out.png
      - name: Functional selfcheck (artifact gate)
        run: |
          dist/lineart --selfcheck
      - uses: actions/upload-artifact@v4
        with:
          name: lineart-linux
          path: dist/lineart
          if-no-files-found: error

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest 预装 Android SDK（/usr/local/lib/android/sdk，许可已接受），
      # 无需 setup-android action（其 sdkmanager 曾在 runner 上失败）
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.5"
      - name: Generate demo keystore
        run: |
          keytool -genkeypair -v -keystore release.keystore -alias lineart \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass lineart123 -keypass lineart123 \
            -dname "CN=lineart-precise, OU=dev, O=lineart, C=CN"
      - name: Build release APK
        working-directory: android
        env:
          LINEART_KEYSTORE: ${{ github.workspace }}/release.keystore
          LINEART_KEYSTORE_PASS: lineart123
          LINEART_KEY_ALIAS: lineart
          LINEART_KEY_PASS: lineart123
        run: gradle :app:assembleRelease --no-daemon
      - name: Check APK exists
        run: test -s android/app/build/outputs/apk/release/app-release.apk
      - name: Verify lineart package inside APK
        run: |
          python3 - << 'EOF'
          import io, zipfile
          apk = zipfile.ZipFile("android/app/build/outputs/apk/release/app-release.apk")
          names = apk.namelist()
          assert "assets/chaquopy/app.imy" in names, "app.imy missing in APK"
          imy = apk.read("assets/chaquopy/app.imy")
          try:
              inner = zipfile.ZipFile(io.BytesIO(imy))
              inner_names = inner.namelist()
          except zipfile.BadZipFile:
              print("app.imy head hex:", imy[:32].hex())
              raise SystemExit("FATAL: app.imy is not a zip archive")
          print("app.imy entries: %d" % len(inner_names))
          print("\n".join(sorted(inner_names)[:60]))
          need = ["lineart/__init__.py", "lineart/pipeline.py", "bridge.py"]
          missing = [n for n in need if n not in inner_names]
          if missing:
              raise SystemExit("FATAL: missing in app.imy: %s" % missing)
          print("lineart package verified inside app.imy")
          EOF
      - name: Bridge real-conversion smoke test (v1.13.0 APK failure lesson)
        run: |
          pip install --quiet opencv-python-headless numpy
          python3 - << 'EOF'
          # v1.14.0：真实转换门禁——v1.13.0 APK「构建成功但转换报错」的教训。
          # 从 app.imy 只提取应用代码（bridge.py + lineart/，避开 arm64 pip 二进制），
          # 在 x86_64 runner 上真实执行 convert_file / binary 契约 / selfcheck
          import io, os, sys, tempfile, zipfile
          apk = zipfile.ZipFile("android/app/build/outputs/apk/release/app-release.apk")
          inner = zipfile.ZipFile(io.BytesIO(apk.read("assets/chaquopy/app.imy")))
          tmp = tempfile.mkdtemp()
          for n in inner.namelist():
              if n == "bridge.py" or n.startswith("lineart/"):
                  inner.extract(n, tmp)
          sys.path.insert(0, tmp)
          import cv2
          import numpy as np
          img = np.full((96, 96, 3), 255, np.uint8)
          cv2.line(img, (16, 16), (80, 80), (40, 40, 40), 2)
          cv2.line(img, (80, 16), (16, 80), (40, 40, 40), 2)
          inp = os.path.join(tmp, "in.png")
          cv2.imwrite(inp, img)
          import bridge
          out1 = os.path.join(tmp, "out1.png")
          info = bridge.convert_file(inp, out1)
          r1 = cv2.imread(out1)
          assert r1 is not None and r1.shape[:2] == (96, 96), info
          out2 = os.path.join(tmp, "out2.png")
          bridge.convert_file(inp, out2, binary=True)
          r2 = cv2.imread(out2)
          assert r2 is not None and set(np.unique(r2).tolist()) <= {0, 255}, \
              "binary output not pure B/W"
          ok, report = bridge.selfcheck()
          assert ok, report
          print("bridge smoke PASS:", info)
          print(report)
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: lineart-android
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-windows, build-linux, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: lineart-windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: lineart-linux
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: lineart-android
          path: dist
      - name: Rename artifacts with version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          mv dist/lineart.exe "dist/lineart-${VER}-windows-x64.exe"
          mv dist/lineart "dist/lineart-${VER}-linux-x64"
          chmod +x "dist/lineart-${VER}-linux-x64"
          mv dist/app-release.apk "dist/lineart-${VER}-android-arm64.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/lineart-*-windows-x64.exe
            dist/lineart-*-linux-x64
            dist/lineart-*-android-arm64.apk
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
