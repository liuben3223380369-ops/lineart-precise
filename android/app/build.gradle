plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.chaquo.python'
}

android {
    namespace 'com.lineart.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.lineart.app"
        minSdk 24
        targetSdk 34
        versionCode 21
        versionName "1.25.0"

        ndk {
            // 现代 Android 手机均为 arm64；只打一个 ABI 控制体积
            abiFilters "arm64-v8a"
        }

        python {
            // Chaquopy 15 支持 Python 3.8/3.10/3.11/3.12
            version "3.10"
            pip {
                // 版本必须落在 Chaquopy 预编译索引（chaquo.com/pypi-13.1，
                // 插件 15.x 实际使用该仓库）已有 wheel 的范围内，否则 pip
                // 退回 sdist 源码构建并因无编译器失败。实测索引最高：
                // numpy 1.26.2（cp310/android_21）、opencv 4.5.1.48
                // （cp310/android_24，正好匹配 minSdk 24）
                install "numpy==1.26.2"
                install "opencv-python==4.5.1.48"
            }
        }
    }

    // v1.25.0：onnx 权重不压缩存储。压缩 asset 的
    // AssetInputStream.available() 只保证「无阻塞可读字节数」，
    // 部分 Android 版本返回内部缓冲区大小而非文件总长——
    // NeuralEngine.hasEnsemble() 的 available() > 1MB 检测会静默
    // 失败，ensemble 降级单模且无任何报错（v1.24.2 用户实测
    // 「只显示 17MB 模型」的疑似根因）。noCompress 后 asset 走
    // mmap，available() = 文件真实大小，检测稳定；读取也免解压。
    androidResources {
        noCompress 'onnx'
    }

    sourceSets {
        main {
            // lineart 主包经 syncLineartPkg 复制为 build/lineart-pkg/lineart
            // 后编入 APK（不经 pip，避免主项目 requirements 的
            // opencv-python-headless 与预编译包冲突）。
            // 注意：Chaquopy srcDir 语义是「目录内容平铺到 Python 顶层」，
            // 不能直接 srcDir "../../lineart"——那会把包内模块平铺成顶层
            // 模块，APK 内无 lineart 包，运行时报 No module named 'lineart'
            python {
                srcDir "build/lineart-pkg"
            }
        }
    }

    signingConfigs {
        release {
            // CI 用环境变量注入（release.yml 中 keytool 生成演示签名）；
            // 本地无 keystore 时请用 assembleDebug
            storeFile file(System.env.LINEART_KEYSTORE ?: "release.keystore")
            storePassword System.env.LINEART_KEYSTORE_PASS ?: "lineart123"
            keyAlias System.env.LINEART_KEY_ALIAS ?: "lineart"
            keyPassword System.env.LINEART_KEY_PASS ?: "lineart123"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // v1.18.0 神经先验：Chaquopy 预编译索引无 onnxruntime，神经推理
    // 经官方 onnxruntime-android（Java API）在 Kotlin 侧完成
    // （NeuralEngine.kt），输出 ink 图经 semantic_map_path 走管线
    // 神经链。AAR 内含多 ABI so，ndk.abiFilters 仅解压 arm64-v8a。
    // v1.19.1：assets/models/lineart.onnx（fp32 原版权重 17MB）
    // 随 APK 打包开箱即用、精度无损；fp16 量化因 CPU EP Cast
    // 往返内存放大 ~6 倍已否决（v1.19.0 大图闪退根因）。
    // v1.23.0：assets/models/dexined.onnx（34.8MB per-channel INT8
    // 重量化版，标准 DQ 任意 ORT 版本可跑；与原版输出偏差 mean
    // 0.000137、0.5 阈值 mask 一致率 99.99%）双权重打包，
    // NeuralEngine 默认 ensemble 三语义融合推理、权重异常自动
    // 托底降级（DexiNed → informative → 传统语义）。
    // v1.24.1：dexined.onnx opset 21→17——onnxruntime-android 1.17
    // 官方支持上限 opset 20，stamp 21 加载即 ORT_INVALID_ARGUMENT
    // 拒载（v1.24.0 APK ensemble 失效根因）；降级后输出逐位一致。
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.17.0'
}

// 把主项目 lineart 包复制为完整包形态（build/lineart-pkg/lineart/），
// 供上面 sourceSets 引用；排除 __pycache__ 与 .pyc
task syncLineartPkg(type: Sync) {
    from "../../lineart"
    into "build/lineart-pkg/lineart"
    exclude "**/__pycache__/**"
    exclude "**/*.pyc"
}
preBuild.dependsOn syncLineartPkg
// 双保险：确保任何 Chaquopy 源码收集任务都在复制之后执行
tasks.matching { it.name.endsWith("PythonSources") }.configureEach { dependsOn syncLineartPkg }
