[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lineart-precise"
version = "1.8.0"
description = "图片到白底黑线高精度转换器（优先级：精度 > 清晰度 > 性能）"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "opencv-python-headless>=4.5",
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = [
    "lineart",
    "lineart.preprocess",
    "lineart.semantics",
    "lineart.localization",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
